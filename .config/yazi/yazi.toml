[manager]
ratio          = [1, 2, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
tab_size       = 2
max_width      = 600
max_height     = 900
cache_dir      = ""
image_filter   = "triangle"
image_quality  = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', desc = "nvim", block = true },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$0")"', desc = "Reveal" },
]
extract = [
  { run = 'unar "$1"', desc = "Extract here" },
]
play = [
  { run = 'mpv "$@"', orphan = true },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { mime = "inode/x-empty", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*", use = "open" },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

[log]
enabled = false
